<h2 class="text-2xl font-bold mt-5">Buscar Gifs</h2>
<h2 class="text-sm text-gray-500">Buscar gifs por nombre, descripción o tags</h2>

<section class="flex flex-col gap-4">
  <input type="text" placeholder="Buscar Gifs"
    class="mt-3 w-full border border-gray-400 rounded-md p-2 outline-none focus:border-blue-500"
    (keyup.enter)="onSearch(txtSearch.value)" #txtSearch />
</section>

<section class="py-5">
  <gifs-list [gifs]="gifs()" />
</section>
