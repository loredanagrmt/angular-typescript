<style>
  h3 {
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-weight: 100;
  }

  ol {
    font-size: 15px;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-weight: 100;
    padding-left: 18px;
  }

  input {
    width: 98.8%;
    margin-bottom: 12px;
    padding: 10px;
    font-size: 16px;
    justify-content: center;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    border-radius: 15px;
    border-style: double;
  }

  button {
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    font-size: 16px;
    justify-content: center;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    background-color: #89CFF0;
    color: white;
    border-color: white;
    border-radius: 15px;
    margin: 0 auto;
  }

  /* para que no cambie de color al click (por bootstrap / focus) */
  button:hover,
  button:active,
  button:focus,
  button:focus-visible {
    background-color: #89CFF0;
    color: white;
    border-color: white;
    outline: none;
    box-shadow: none;
  }
</style>

<h3>Datos actuales</h3>
<div>
  <ol>
    <li><strong>Nombre:</strong> {{ nombreModi() }}</li>
    <li><strong>Teléfono:</strong> {{ phoneModi() }}</li>
    <li><strong>Email:</strong> {{ emailModi() }}</li>
  </ol>
</div>

<h3>Editar datos</h3>

<div>
  <input type="text" class="form-control" placeholder="Nombre" [value]="nombreModi()"
    (input)="nombreModi.set(txtNombre.value)" #txtNombre />

  <input type="number" class="form-control" placeholder="Teléfono" [value]="phoneModi()"
    (input)="phoneModi.set(+txtPhone.value)" #txtPhone />

  <input type="email" class="form-control" placeholder="Email" [value]="emailModi()"
    (input)="emailModi.set(txtEmail.value)" #txtEmail />

  <button>
    Guardar
  </button>

  <!-- <button (click)="guardarCambios()">
    Guardar
  </button> -->
</div>
