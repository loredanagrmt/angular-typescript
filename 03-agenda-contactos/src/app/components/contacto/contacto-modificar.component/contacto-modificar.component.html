<style>
  h3 {
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-weight: 100;
  }

  ol {
    font-size: 15px;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-weight: 100;
    padding-left: 18px;
  }

  input {
    width: 98.8%;
    margin-bottom: 12px;
    padding: 10px;
    font-size: 16px;
    justify-content: center;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    border-radius: 15px;
    border-style: double;
  }

  button {
    width: 100%;
    margin-bottom: 12px;
    padding: 10px;
    font-size: 16px;
    justify-content: center;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    background-color: #89CFF0;
    color: white;
    border-color: white;
    border-radius: 15px;
    margin: 0 auto;
  }

  button:hover,
  button:active,
  button:focus,
  button:focus-visible {
    background-color: #89CFF0;
    color: white;
    border-color: white;
    outline: none;
    box-shadow: none;
  }

  span{
   font-family: Verdana, Geneva, Tahoma, sans-serif;
   font-size: 15px;
  }
</style>



<h3>Editar datos</h3>

<div>

  <input type="text" class="form-control" placeholder="Nombre" [value]="nombreModi()"
    (input)="nombreModi.set(txtNombre.value)" #txtNombre />

  <input type="number" class="form-control" placeholder="Teléfono" [value]="phoneModi()"
    (input)="phoneModi.set(+txtPhone.value)" #txtPhone />

  <input type="email" class="form-control" placeholder="Email" [value]="emailModi()"
    (input)="emailModi.set(txtEmail.value)" #txtEmail />

<span id="emailError" style="color: red; display: none;"></span>
<span id="datosAcualizados" style="color: #89CFF0; display: none;"></span>

<button (click)="guardarCambios()">
  Guardar
</button>

</div>
